name: migrations

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "migrations/**"
      - ".github/workflows/migrations.yaml"

permissions:
  contents: read

jobs:
  migrate:
    name: up-down
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations (up)
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/migrations:/migrations" \
            migrate/migrate:v4.19.1 \
            -path /migrations -database "$DATABASE_URL" up

      - name: Revert migrations (down)
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/migrations:/migrations" \
            migrate/migrate:v4.19.1 \
            -path /migrations -database "$DATABASE_URL" down -all
